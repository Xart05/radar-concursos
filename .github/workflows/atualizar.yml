name: Atualizar concursos

on:
  schedule:
    - cron: "0 11 * * 1" # toda segunda às 8h de Fortaleza (11h UTC)
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main] # publica o site quando alguém edita os arquivos

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-concursos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Buscar concursos no PCI
        if: github.event_name != 'push'
        run: python3 scripts/atualizar.py

      - name: Salvar a lista atualizada
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados
          git diff --cached --quiet || git commit -m "Atualiza concursos ($(date +%d/%m/%Y))"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: publicar
        uses: actions/deploy-pages@v4
